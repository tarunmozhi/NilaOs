[workspace]
resolver = "2"
members = [
    "crates/mhr-core",
    "crates/mfr-nila",
    "crates/nila-security",
    "crates/nila-services",
    "tools/mhr-cli",
    "crates/nila-bootstrap",
]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Nila OS Project"]
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"