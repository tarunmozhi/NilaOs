name: Nila OS CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-checks:
    name: Rust workspace checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate vivo 1906 device profile
        run: python3 scripts/validate-device-profile.py

      - name: Test device profile validator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check kernel build helper syntax
        run: bash -n scripts/build-kernel.sh

      - name: Check kernel build helper usage
        run: bash scripts/build-kernel.sh --help

      - name: Reject unsafe kernel build inputs
        shell: bash
        run: |
          if KERNEL_SRC=/tmp KERNEL_DEFCONFIG=../escape JOBS=1 bash scripts/build-kernel.sh >/dev/null 2>&1; then
            echo "ERROR: unsafe defconfig path was accepted" >&2
            exit 1
          fi
          if KERNEL_SRC=/tmp KERNEL_DEFCONFIG=defconfig JOBS=0 bash scripts/build-kernel.sh >/dev/null 2>&1; then
            echo "ERROR: invalid build parallelism was accepted" >&2
            exit 1
          fi

      - name: Generate and upload resolved Cargo lockfile
        run: cargo generate-lockfile

      - name: Commit generated lockfile to this repository branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Cargo.lock for Ed25519"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH_NAME}"
          fi

      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
