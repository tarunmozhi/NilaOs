name: Nila OS CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runner-syntax:
    name: Validate Windows PowerShell runner syntax
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Parse local runner without executing it
        shell: pwsh
        run: |
          $scriptText = Get-Content -Raw "scripts/run-nila-checks.ps1"
          [void][scriptblock]::Create($scriptText)
          Write-Host "PowerShell syntax is valid."

  rust-checks:
    name: Rust workspace checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate vivo 1906 device profile
        run: python3 scripts/validate-device-profile.py

      - name: Test device profile validator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check kernel build helper syntax
        run: bash -n scripts/build-kernel.sh

      - name: Check kernel build helper usage
        run: bash scripts/build-kernel.sh --help

      - name: Reject unsafe kernel build inputs
        shell: bash
        run: |
          if KERNEL_SRC=/tmp KERNEL_DEFCONFIG=../escape JOBS=1 bash scripts/build-kernel.sh >/dev/null 2>&1; then
            echo "ERROR: unsafe defconfig path was accepted" >&2
            exit 1
          fi
          if KERNEL_SRC=/tmp KERNEL_DEFCONFIG=defconfig JOBS=0 bash scripts/build-kernel.sh >/dev/null 2>&1; then
            echo "ERROR: invalid build parallelism was accepted" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --locked -- -D warnings
