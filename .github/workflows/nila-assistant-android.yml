name: Nila Assistant Android

on:
  push:
    branches:
      - feature/nila-assistant-v1
  pull_request:
    paths:
      - "apps/nila-assistant/**"
      - "docs/NILA_ASSISTANT_ARCHITECTURE.md"
      - ".github/workflows/nila-assistant-android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run policy unit tests
        run: gradle -p apps/nila-assistant testDebugUnitTest
      - name: Build debug APK
        run: gradle -p apps/nila-assistant assembleDebug
